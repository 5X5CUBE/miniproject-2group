<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"> 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  

  <style>
    /* 폰트 및 배경 설정 */
    body {
        font-family: 'Noto Sans KR', sans-serif;
        background-color: #f0f2f5; 
        color: #333;
    }

    /* 화면 중앙 배치를 위한 설정 */
    .main-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        padding: 40px 0;
    }

    /* 회원가입 카드 디자인 */
    .signup-card {
        background-color: white;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(0,0,0,0.1); /* 그림자 추가로 입체감 */
        border: 1px solid #ddd;
    }

    /* 초록색 포인트 텍스트 */
    h2 {
        text-align: center;
        color: #2E7D32;
        margin-bottom: 30px;
        font-weight: bold;
    }

    /* 입력 라벨 스타일 */
    .form-label {
        font-weight: bold;
        font-size: 14px;
        color: #555;
    }

    /* 포커스 시 초록색 테두리 (부트스트랩 덮어쓰기) */
    .form-control:focus, .form-select:focus {
        border-color: #2E7D32;
        box-shadow: 0 0 0 0.25rem rgba(46, 125, 50, 0.25);
    }

    /* 중복확인 등 버튼 스타일 */
    .btn-outline-custom {
        color: #2E7D32;
        border-color: #2E7D32;
    }
    .btn-outline-custom:hover {
        background-color: #2E7D32;
        color: white;
    }

    /* 가입하기 버튼 스타일 */
    .btn-submit {
        width: 100%;
        height: 50px;
        background-color: #2E7D32;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        font-weight: bold;
        margin-top: 20px;
        transition: background-color 0.2s;
    }
    .btn-submit:hover {
        background-color: #1b5e20;
    }
  </style>
	
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
   <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <script th:src="@{js/user.js}"></script>
 
</head>
<body>

  <div class="container main-container">
      <div class="row w-100 justify-content-center">
          
         
          <div class="col-lg-4 d-none d-lg-block"></div>

 
          <div class="col-lg-4 col-md-8 col-12">
              <div class="signup-card">
              <h2>회원가입</h2>
              	<form id="joinForm" action="/joinResult" method="post">
              	
                  <input type="hidden" id="isIdCheck" value="false"> 
                  <input type="hidden" id="isNickCheck" value="false"> 

                  <div class="mb-3">
                      <label class="form-label">아이디</label>
                      <div class="input-group">
                        <input type="text"  class="form-control"  id="loginId"  name="loginId"  placeholder="아이디 입력"  oninput="resetIdCheck()">
                          <button type="button" id="btnIdCheck" class="btn btn-outline-custom">중복확인</button>
                      </div>
                  </div>


                  <div class="mb-3">
                      <label class="form-label">비밀번호</label>
                      <input type="password" class="form-control" id="pass1" name="pass1" placeholder="비밀번호 입력">
                  </div>

                  <div class="mb-3">
                      <label class="form-label">비밀번호 확인</label>
                      <input type="password" class="form-control" id="pass2" name="pass2" placeholder="비밀번호 재입력">
                  </div>
                  

                  <div class="mb-3">
                      <label class="form-label">닉네임</label>
                      <div class="input-group">
                          <input type="text" class="form-control" name="nickname"  id ="nickname"  placeholder="닉네임 입력" oninput="resetNickCheck()">
                          <button type="button"  id="btnNickCheck" class="btn btn-outline-custom">중복확인</button>
                      </div>
                  </div>
                  
                  <div class="mb-3">
                      <label class="form-label">이름</label>
                      <input type="text" class="form-control" id="username" name="username" placeholder="이름 입력">
                  </div>
                  
                  <div class="mb-3">
                      <label class="form-label">생년월일</label>
                      <input type="date" class="form-control" name="birthdate">
                  </div>

                  <div class="mb-3">
                      <label class="form-label">성별</label>
                      <select class="form-select" name="gender">
                          <option value="" selected>성별 선택</option>
                          <option value="M">남성</option>
                          <option value="F">여성</option>
                      </select>
                  </div>

                  <div class="mb-3">
                    <label class="form-label">휴대전화</label>
                    <div class="row g-2 align-items-center">
                        <div class="col-3">
                            <select class="form-select text-center" id="mobile1"  name="mobile1">
                                <option>010</option>
                                <option>011</option>
                                <option>016</option>
                                <option>017</option>
                            </select>
                        </div>
                        <div class="col-auto">
                            <span class="fw-bold">-</span>
                        </div>
                        <div class="col">
                            <input type="text" class="form-control text-center" id="mobile2" name="mobile2" maxlength="4">
                        </div>
                        <div class="col-auto">
                            <span class="fw-bold">-</span>
                        </div>
                        <div class="col">
                            <input type="text" class="form-control text-center" id="mobile3" name="mobile3" maxlength="4">
                        </div>
                    </div>
                  </div>

                  
                  <div class="mb-3">
                      <label class="form-label">주소</label>
                      <div class="input-group mb-2">
                        <input type="text" id="sample6_postcode" name="zipcode" class="form-control" placeholder="우편번호" readonly>
        				<button type="button" class="btn btn-outline-secondary" onclick="sample6_execDaumPostcode()">우편번호 찾기</button>
                      </div>
                      	<input type="text" id="sample6_address" name="addr1" class="form-control mb-2" placeholder="주소" readonly>
                    	<input type="text" id="sample6_detailAddress" name="addr2" class="form-control" placeholder="상세주소">
                  </div>

                  <button type="submit" class="btn btn-submit">가입하기</button>
               </form>   
              </div>
              
          </div>

        
          <div class="col-lg-4 d-none d-lg-block"></div>

      </div>
  </div>

</body>
</html>
