

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"> 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
   <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <script th:src="@{js/login.js}"></script>
  <style>
    /* 1. 폰트 및 배경 설정 (회원가입 폼과 동일) */
    body {
        font-family: 'Noto Sans KR', sans-serif;
        background-color: #f0f2f5; /* 밝은 회색 배경 */
        color: #333;
    }

    /* 2. 헤더 스타일 (초록색) */
    header {
        width: 100%;
        height: 60px;
        background-color: #2E7D32;
        display: flex;
        align-items: center;
        padding-left: 20px;
        color: white;
        font-weight: bold;
        font-size: 1.2rem;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    /* 3. 중앙 정렬 컨테이너 */
    .main-container {
        min-height: calc(100vh - 60px); /* 헤더 제외 높이 */
        display: flex;
        align-items: center; /* 수직 중앙 정렬 */
        padding: 40px 0;
    }

    /* 4. 로그인 카드 스타일 */
    .login-card {
        background-color: white;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(0,0,0,0.1);
        border: 1px solid #ddd;
    }

    /* 제목 스타일 */
    .login-card h2 {
        text-align: center;
        color: #2E7D32;
        margin-bottom: 30px;
        font-weight: bold;
        font-size: 1.8rem;
    }

    /* 입력창 포커스 효과 */
    .form-control ,.form-select{
        height: 50px; 
        border-radius: 5px;
    }
    .form-control:focus {
        border-color: #2E7D32;
        box-shadow: 0 0 0 0.25rem rgba(46, 125, 50, 0.25);
    }

    /* 로그인 버튼 스타일 */
    .btn-login {
        width: 100%;
        height: 50px;
        background-color: #2E7D32;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 18px;
        font-weight: bold;
        margin-top: 10px;
        margin-bottom: 20px;
        transition: background-color 0.2s;
    }

    .btn-login:hover {
        background-color: #1b5e20;
    }

    /* 하단 링크 (회원가입, 비번찾기) */
    .link-group a {
        text-decoration: none;
        color: #666;
        font-size: 14px;
        transition: color 0.2s;
    }
    .link-group a:hover {
        color: #2E7D32;
        font-weight: bold;
    }
    .form-select:focus {
        border-color: #2E7D32;
        box-shadow: 0 0 0 0.25rem rgba(46, 125, 50, 0.25);
    }
  </style>
</head>
<body>

  <!-- 메인 영역 -->
  <div class="container main-container">
    <div class="row w-100 justify-content-center">

        <div class="col-lg-4 d-none d-lg-block"></div>

        <div class="col-lg-4 col-md-8 col-12">
        
            <div class="login-card">
                <h2>로그인</h2>

                <form class="my-5" id="loginForm" action="userlogin" method="post">
                    <!-- 아이디 입력 -->
                    <div class="mb-3">
                        <input type="text" class="form-control" placeholder="아이디" id="loginId" name="loginId">
                    </div>

                    <!-- 비밀번호 입력 -->
                    <div class="mb-3">
                        <input type="password" class="form-control" placeholder="비밀번호" id="password" name="password">
                    </div>

                    <!-- 로그인 버튼 -->
                    <button type="submit" class="btn btn-login"  id="btnLogin">로그인</button>

                    <!-- 하단 링크 -->
                    <div class="d-flex justify-content-between link-group">
                        <a href="/usersjoin">회원가입</a>
                        <a href="#idSearchModal" data-bs-toggle="modal" >아이디 찾기</a>
                        <a href="#passSearchModal" data-bs-toggle="modal" >비밀번호 찾기</a>
                    </div>
                </form>

            </div>
        </div>

        <div class="col-lg-4 d-none d-lg-block"></div>

    </div>
  </div>

<!-- 모달부분 -->
	<div class="modal fade" id="idSearchModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
	  <div class="modal-dialog">
	    <div class="modal-content">
	      <div class="modal-header">
	        <h1 class="modal-title fs-5" id="staticBackdropLabel">아이디 찾기</h1>
	        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
	      </div>
	      <div class="modal-body">
		      	 <div class="mb-3">
		      	 <h3 class="modal-title fs-6 mb-2" id="staticBackdropLabel">이름 입력</h3>
		      	 <div class="mb-3">
		      	 	 <input type="text" class="form-control"  id="username"  name="username">
		      	 </div>
		      	 <h3 class="modal-title fs-6 mb-2" id="staticBackdropLabel">전화번호 입력</h3>
	                 <div class="row g-2 align-items-center">
	                     <div class="col-3">
	                         <select class="form-select text-center" id="searchMobile1">
	                             <option>010</option>
	                             <option>011</option>
	                             <option>016</option>
	                             <option>017</option>
	                         </select>
	                     </div>
	                     <div class="col-auto">
	                         <span class="fw-bold">-</span>
	                     </div>
	                     <div class="col">
	                         <input type="text" class="form-control text-center" id="searchMobile2" maxlength="4">
	                     </div>
	                     <div class="col-auto">
	                         <span class="fw-bold">-</span>
	                     </div>
	                     <div class="col">
	                         <input type="text" class="form-control text-center" id="searchMobile3" maxlength="4">
	                     </div>
	                 </div>
	               </div>
		      </div>
		      <div class="modal-footer">
		        <button type="button" class="btn btn-primary" id="btnFindId">아이디 찾기</button>
		        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
		      </div>
	    </div>
	  </div>
	</div>
	
	<div class="modal fade" id="passSearchModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
	  <div class="modal-dialog">
	    <div class="modal-content">
	      <div class="modal-header">
	        <h1 class="modal-title fs-5" id="staticBackdropLabel">비밀번호 찾기</h1>
	        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
	      </div>
	      <div class="modal-body">
		      	 <div class="mb-3">
		      	 <h3 class="modal-title fs-6 mb-2" id="staticBackdropLabel">아이디 입력</h3>
		      	 <div class="mb-3">
		      	 	 <input type="text" class="form-control"  id="searchPassId">
		      	 </div>
		      	 <h3 class="modal-title fs-6 mb-2" id="staticBackdropLabel">전화번호 입력</h3>
	                 <div class="row g-2 align-items-center">
	                     <div class="col-3">
	                         <select class="form-select text-center" id="searchPassMobile1">
	                             <option>010</option>
	                             <option>011</option>
	                             <option>016</option>
	                             <option>017</option>
	                         </select>
	                     </div>
	                     <div class="col-auto">
	                         <span class="fw-bold">-</span>
	                     </div>
	                     <div class="col">
	                         <input type="text" class="form-control text-center" id="searchPassMobile2" maxlength="4">
	                     </div>
	                     <div class="col-auto">
	                         <span class="fw-bold">-</span>
	                     </div>
	                     <div class="col">
	                         <input type="text" class="form-control text-center" id="searchPassMobile3" maxlength="4">
	                     </div>
	                 </div>
	               </div>
		      </div>
		      <div class="modal-footer">
		        <button type="button" class="btn btn-primary" id="btnCheckUser">확인</button>
		        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
		      </div>
	    </div>
	  </div>
	</div>
	
	
	<div class="modal fade" id="passChangeModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
	  <div class="modal-dialog">
	    <div class="modal-content">
	      <div class="modal-header">
	        <h1 class="modal-title fs-5" id="staticBackdropLabel">비밀번호 재설정</h1>
	        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
	      </div>
	      <div class="modal-body">
		      	 <div class="mb-3">
		      	 <h3 class="modal-title fs-6 mb-2" id="staticBackdropLabel">비밀번호 변경</h3>
		      	 <div class="mb-3">
		      	 	 <input type="password" class="form-control" id="newResetPass1">
		      	 </div>
		      	 <h3 class="modal-title fs-6 mb-2" id="staticBackdropLabel">비밀번호 재입력</h3>
	              <div class="mb-3">
		      	 		<input type="password" class="form-control" id="newResetPass2">
		      	 </div>   
	             </div>
		     </div>
		      <div class="modal-footer">
		        <button type="button" class="btn btn-primary" id="btnRunResetPass">변경 확인</button>
		        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
		      </div>
	    </div>
	  </div>
	</div>
	
	

</body>
</html>
